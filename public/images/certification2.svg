<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="tc2-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="50%" stop-color="#0a1329" />
      <stop offset="100%" stop-color="#070c1e" />
    </linearGradient>
    <radialGradient id="tc2-glow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.28" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#050814" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="tc2-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="tc2-titleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <filter id="tc2-glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#38bdf8" flood-opacity="0.7" />
    </filter>
    <filter id="tc2-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.85" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="450" fill="url(#tc2-bg)" />
  <rect width="800" height="450" fill="url(#tc2-glow)" />

  <!-- 3D Perspective Grid -->
  <g opacity="0.35">
    <line x1="0" y1="280" x2="800" y2="280" stroke="#38bdf8" stroke-width="1.2" />
    <line x1="0" y1="315" x2="800" y2="315" stroke="#38bdf8" stroke-width="1" />
    <line x1="0" y1="360" x2="800" y2="360" stroke="#38bdf8" stroke-width="1.5" />
    <line x1="0" y1="420" x2="800" y2="420" stroke="#38bdf8" stroke-width="2" />
    <!-- Perspective Rays converging at (400, 240) -->
    <line x1="400" y1="240" x2="-100" y2="450" stroke="#38bdf8" stroke-width="1" />
    <line x1="400" y1="240" x2="100" y2="450" stroke="#38bdf8" stroke-width="1" />
    <line x1="400" y1="240" x2="250" y2="450" stroke="#38bdf8" stroke-width="1.2" />
    <line x1="400" y1="240" x2="400" y2="450" stroke="#38bdf8" stroke-width="1.5" />
    <line x1="400" y1="240" x2="550" y2="450" stroke="#38bdf8" stroke-width="1.2" />
    <line x1="400" y1="240" x2="700" y2="450" stroke="#38bdf8" stroke-width="1" />
    <line x1="400" y1="240" x2="900" y2="450" stroke="#38bdf8" stroke-width="1" />
  </g>

  <!-- Floating 3D Wireframe Polyhedron / Mesh in Center -->
  <g transform="translate(400, 160)" filter="url(#tc2-shadow)">
    <!-- Outer Orbit Ring -->
    <ellipse cx="0" cy="0" rx="140" ry="45" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="6,4" opacity="0.6" />
    <ellipse cx="0" cy="0" rx="100" ry="100" fill="none" stroke="#818cf8" stroke-width="0.8" opacity="0.3" />

    <!-- 3D Isometric Shaded &amp; Wireframe Cube -->
    <!-- Top Face -->
    <polygon points="0,-65 56,-32 0,0 -56,-32" fill="#1e293b" fill-opacity="0.8" stroke="#38bdf8" stroke-width="2" />
    <!-- Left Face -->
    <polygon points="-56,-32 0,0 0,65 -56,32" fill="#0f172a" fill-opacity="0.85" stroke="#38bdf8" stroke-width="2" />
    <!-- Right Face -->
    <polygon points="56,-32 0,0 0,65 56,32" fill="#1e1b4b" fill-opacity="0.8" stroke="#818cf8" stroke-width="2" />

    <!-- Inner Wireframe Subdivisions -->
    <line x1="-28" y1="-16" x2="28" y2="-16" stroke="#60a5fa" stroke-width="1" stroke-dasharray="3,3" opacity="0.7" />
    <line x1="0" y1="-32" x2="0" y2="32" stroke="#60a5fa" stroke-width="1" stroke-dasharray="3,3" opacity="0.7" />
    <line x1="-28" y1="16" x2="28" y2="48" stroke="#818cf8" stroke-width="1" stroke-dasharray="3,3" opacity="0.7" />

    <!-- Transform Gizmo Core (Center) -->
    <g transform="translate(0, 0)">
      <!-- Z Axis (Blue, down-right) -->
      <line x1="0" y1="0" x2="35" y2="20" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
      <polygon points="35,20 28,15 31,25" fill="#38bdf8" />
      <!-- X Axis (Red, down-left) -->
      <line x1="0" y1="0" x2="-35" y2="20" stroke="#ef4444" stroke-width="3" stroke-linecap="round" />
      <polygon points="-35,20 -31,25 -28,15" fill="#ef4444" />
      <!-- Y Axis (Green, up) -->
      <line x1="0" y1="0" x2="0" y2="-45" stroke="#22c55e" stroke-width="3" stroke-linecap="round" />
      <polygon points="0,-45 -4,-37 4,-37" fill="#22c55e" />
      <circle cx="0" cy="0" r="4" fill="#ffffff" />
    </g>

    <!-- Floating Vertex Points -->
    <circle cx="0" cy="-65" r="3.5" fill="#38bdf8" filter="url(#tc2-glowFilter)" />
    <circle cx="56" cy="-32" r="3.5" fill="#818cf8" filter="url(#tc2-glowFilter)" />
    <circle cx="-56" cy="-32" r="3.5" fill="#38bdf8" filter="url(#tc2-glowFilter)" />
    <circle cx="0" cy="65" r="3.5" fill="#c084fc" filter="url(#tc2-glowFilter)" />
    <circle cx="56" cy="32" r="3.5" fill="#818cf8" filter="url(#tc2-glowFilter)" />
    <circle cx="-56" cy="32" r="3.5" fill="#38bdf8" filter="url(#tc2-glowFilter)" />
  </g>

  <!-- Viewport HUD Overlay Elements -->
  <!-- Top Left Badge -->
  <g transform="translate(35, 35)">
    <rect x="0" y="0" width="168" height="26" rx="13" fill="#0f172a" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="14" cy="13" r="4" fill="#22c55e" />
    <text x="26" y="17" font-family="'JetBrains Mono', 'Inter', monospace" font-size="10" font-weight="700" fill="#38bdf8" letter-spacing="1.5">
      UNITY · C# ENGINE
    </text>
  </g>

  <!-- Top Right Badge -->
  <g transform="translate(635, 35)">
    <rect x="0" y="0" width="130" height="26" rx="13" fill="#0f172a" fill-opacity="0.8" stroke="#818cf8" stroke-width="1.2" />
    <text x="65" y="17" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#c084fc" text-anchor="middle" letter-spacing="2">
      DIPLOMA 2026
    </text>
  </g>

  <!-- Viewport Coordinate HUD (Left side) -->
  <g transform="translate(35, 130)" opacity="0.6">
    <text x="0" y="0" font-family="monospace" font-size="9" fill="#94a3b8">POS  [0.0, 1.8, 14.2]</text>
    <text x="0" y="15" font-family="monospace" font-size="9" fill="#94a3b8">ROT  [15°, 45°, 0°]</text>
    <text x="0" y="30" font-family="monospace" font-size="9" fill="#94a3b8">CAM  PERSPECTIVE 60°</text>
    <text x="0" y="45" font-family="monospace" font-size="9" fill="#38bdf8">FPS  60.0 [SYNC OK]</text>
  </g>

  <!-- Viewport HUD (Right side) -->
  <g transform="translate(765, 130)" text-anchor="end" opacity="0.6">
    <text x="0" y="0" font-family="monospace" font-size="9" fill="#94a3b8">ENGINE: UNITY 3D</text>
    <text x="0" y="15" font-family="monospace" font-size="9" fill="#94a3b8">PIPELINE: URP REAL-TIME</text>
    <text x="0" y="30" font-family="monospace" font-size="9" fill="#94a3b8">SHADERS: HLSL / PBR</text>
    <text x="0" y="45" font-family="monospace" font-size="9" fill="#818cf8">HOST: ALISON</text>
  </g>

  <!-- Vignette Gradient at Bottom for Title Contrast -->
  <rect x="0" y="240" width="800" height="210" fill="url(#tc2-bg)" opacity="0.92" />

  <!-- Bottom Title Block -->
  <g transform="translate(400, 310)" text-anchor="middle" filter="url(#tc2-shadow)">
    <!-- Small Category Label -->
    <text x="0" y="0" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="800" fill="#38bdf8" letter-spacing="4">
      ALISON · DIPLOMA COURSE
    </text>
    <!-- Big Bold Title -->
    <text x="0" y="38" font-family="'Inter', -apple-system, sans-serif" font-size="34" font-weight="900" fill="url(#tc2-titleGrad)" letter-spacing="1">
      3D GAME DEVELOPMENT
    </text>
    <!-- Subtitle -->
    <text x="0" y="66" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="600" fill="#94a3b8" letter-spacing="1">
      UNITY ENGINE ARCHITECTURE · C# SYSTEMS · PHYSICS &amp; LIGHTING
    </text>
  </g>

  <!-- Bottom Tech Pills / Tags -->
  <g transform="translate(400, 412)" text-anchor="middle">
    <!-- Pill 1 -->
    <rect x="-260" y="-12" width="120" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="-200" y="4" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#38bdf8">C# GAME LOOPS</text>

    <!-- Pill 2 -->
    <rect x="-125" y="-12" width="115" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="-67" y="4" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#818cf8">3D RIGIDBODY</text>

    <!-- Pill 3 -->
    <rect x="10" y="-12" width="115" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="67" y="4" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#c084fc">ANIMATION</text>

    <!-- Pill 4 -->
    <rect x="145" y="-12" width="115" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="202" y="4" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#38bdf8">3D LIGHTING</text>
  </g>

  <!-- Technical Corner Accents -->
  <path d="M 16 32 L 16 16 L 32 16" fill="none" stroke="#38bdf8" stroke-width="2.5" />
  <path d="M 784 32 L 784 16 L 768 16" fill="none" stroke="#38bdf8" stroke-width="2.5" />
  <path d="M 16 418 L 16 434 L 32 434" fill="none" stroke="#38bdf8" stroke-width="2.5" />
  <path d="M 784 418 L 784 434 L 768 434" fill="none" stroke="#38bdf8" stroke-width="2.5" />
</svg>
