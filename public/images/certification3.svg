<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <defs>
    <linearGradient id="c3-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070714" />
      <stop offset="50%" stop-color="#0f112b" />
      <stop offset="100%" stop-color="#181335" />
    </linearGradient>
    <radialGradient id="c3-glow" cx="50%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#070714" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="c3-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="c3-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <pattern id="c3-grid" width="45" height="45" patternUnits="userSpaceOnUse">
      <path d="M 45 0 L 0 0 0 45" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3" />
      <text x="22" y="24" font-family="monospace" font-size="6" fill="#8b5cf6" fill-opacity="0.2">&gt;_</text>
    </pattern>
    <filter id="c3-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.75" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="520" fill="url(#c3-bg)" />
  <rect width="800" height="520" fill="url(#c3-glow)" />
  <rect width="800" height="520" fill="url(#c3-grid)" />

  <!-- Outer Certificate Frame -->
  <rect x="22" y="22" width="756" height="476" rx="8" fill="none" stroke="url(#c3-purple)" stroke-width="2" />
  <rect x="28" y="28" width="744" height="464" rx="6" fill="none" stroke="url(#c3-gold)" stroke-width="0.8" stroke-opacity="0.4" stroke-dasharray="6,4" />
  <rect x="34" y="34" width="732" height="452" rx="4" fill="none" stroke="#475569" stroke-width="0.5" stroke-opacity="0.3" />

  <!-- Corner Filigree -->
  <g transform="translate(34, 34)">
    <path d="M 0 0 L 32 0 L 32 6 L 6 6 L 6 32 L 0 32 Z" fill="url(#c3-purple)" />
    <circle cx="14" cy="14" r="2.5" fill="#fde047" />
  </g>
  <g transform="translate(766, 34)">
    <path d="M 0 0 L -32 0 L -32 6 L -6 6 L -6 32 L 0 32 Z" fill="url(#c3-purple)" />
    <circle cx="-14" cy="14" r="2.5" fill="#fde047" />
  </g>
  <g transform="translate(34, 486)">
    <path d="M 0 0 L 32 0 L 32 -6 L 6 -6 L 6 -32 L 0 -32 Z" fill="url(#c3-purple)" />
    <circle cx="14" cy="-14" r="2.5" fill="#fde047" />
  </g>
  <g transform="translate(766, 486)">
    <path d="M 0 0 L -32 0 L -32 -6 L -6 -6 L -6 -32 L 0 -32 Z" fill="url(#c3-purple)" />
    <circle cx="-14" cy="-14" r="2.5" fill="#fde047" />
  </g>

  <!-- Top Badge -->
  <g transform="translate(400, 68)" text-anchor="middle">
    <rect x="-195" y="-13" width="390" height="26" rx="13" fill="#0f112b" stroke="url(#c3-purple)" stroke-width="1.2" />
    <text x="0" y="5" font-family="'Inter', -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#ddd6fe" letter-spacing="3.5">
      SIMPLILEARN SKILLUP · AI PROMPT SPECIALIZATION
    </text>
  </g>

  <!-- Prompt Syntax Terminal Icon -->
  <g transform="translate(400, 122)" filter="url(#c3-shadow)">
    <rect x="-24" y="-18" width="48" height="36" rx="6" fill="#1e1b4b" stroke="url(#c3-purple)" stroke-width="1.8" />
    <!-- Prompt Command Cursor -->
    <polyline points="-12,-6 -6,0 -12,6" fill="none" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="-2" y1="6" x2="12" y2="6" stroke="#fde047" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Certificate Subtitle -->
  <text x="400" y="188" font-family="'Inter', -apple-system, sans-serif" font-size="12" font-weight="700" fill="#a78bfa" text-anchor="middle" letter-spacing="4">
    CERTIFICATE OF PROFICIENCY
  </text>

  <!-- Certificate Title -->
  <text x="400" y="222" font-family="'Inter', -apple-system, sans-serif" font-size="25" font-weight="900" fill="url(#c3-gold)" text-anchor="middle" letter-spacing="0.5">
    INTRODUCTION TO PROMPT ENGINEERING
  </text>
  <text x="400" y="246" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="1.2">
    FEW-SHOT CONDITIONING · CONTEXT DESIGN &amp; AI ORCHESTRATION
  </text>

  <!-- Divider Line -->
  <g transform="translate(400, 264)">
    <line x1="-220" y1="0" x2="-20" y2="0" stroke="url(#c3-purple)" stroke-width="1" stroke-opacity="0.6" />
    <polygon points="0,-5 5,0 0,5 -5,0" fill="#a78bfa" />
    <line x1="20" y1="0" x2="220" y2="0" stroke="url(#c3-purple)" stroke-width="1" stroke-opacity="0.6" />
  </g>

  <!-- Conferred To Subtitle -->
  <text x="400" y="290" font-family="'Georgia', serif" font-size="13" font-style="italic" fill="#94a3b8" text-anchor="middle" letter-spacing="0.5">
    This credential is officially conferred upon
  </text>

  <!-- Recipient Name -->
  <text x="400" y="328" font-family="'Inter', -apple-system, sans-serif" font-size="28" font-weight="900" fill="#f8fafc" text-anchor="middle" letter-spacing="2">
    SRIRAM S
  </text>

  <!-- Description Text -->
  <text x="400" y="358" font-family="'Inter', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#94a3b8" text-anchor="middle" letter-spacing="0.2">
    demonstrating verified proficiency in structured prompt architectures, chain-of-thought methods,
  </text>
  <text x="400" y="375" font-family="'Inter', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#94a3b8" text-anchor="middle" letter-spacing="0.2">
    context window optimization &amp; generative AI automation for engineering workflows.
  </text>

  <!-- Bottom Details &amp; Verification Section -->
  <!-- Left: Signature -->
  <g transform="translate(130, 420)">
    <path d="M 0 16 Q 30 -2, 60 14 T 115 8 T 150 16" fill="none" stroke="#a78bfa" stroke-width="1.8" stroke-linecap="round" />
    <line x1="0" y1="24" x2="160" y2="24" stroke="#475569" stroke-width="1" />
    <text x="80" y="38" font-family="'Inter', -apple-system, sans-serif" font-size="9" font-weight="700" fill="#f8fafc" text-anchor="middle" letter-spacing="1">SIMPLILEARN AI FACULTY</text>
    <text x="80" y="49" font-family="'Inter', -apple-system, sans-serif" font-size="8" font-weight="500" fill="#64748b" text-anchor="middle">Lead AI Researcher</text>
  </g>

  <!-- Center: Glowing Holographic Seal -->
  <g transform="translate(400, 436)" filter="url(#c3-shadow)">
    <circle cx="0" cy="0" r="32" fill="#131238" stroke="url(#c3-purple)" stroke-width="2.2" />
    <circle cx="0" cy="0" r="26" fill="none" stroke="#f59e0b" stroke-width="0.8" stroke-dasharray="3,2" />
    <text x="0" y="-8" font-family="'Inter', sans-serif" font-size="8" font-weight="900" fill="#fde047" text-anchor="middle">★ ★ ★</text>
    <text x="0" y="4" font-family="'Inter', sans-serif" font-size="8.5" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">PROMPT</text>
    <text x="0" y="14" font-family="'Inter', sans-serif" font-size="7" font-weight="700" fill="#a78bfa" text-anchor="middle" letter-spacing="1">VERIFIED</text>
  </g>

  <!-- Right: Verification &amp; Serial -->
  <g transform="translate(670, 420)" text-anchor="middle">
    <g transform="translate(-16, 0)">
      <rect x="0" y="0" width="32" height="20" rx="3" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.2" />
      <line x1="8" y1="5" x2="24" y2="5" stroke="#8b5cf6" stroke-width="1.5" />
      <line x1="8" y1="10" x2="18" y2="10" stroke="#fde047" stroke-width="1.5" />
      <line x1="8" y1="15" x2="22" y2="15" stroke="#38bdf8" stroke-width="1.5" />
    </g>
    <line x1="-80" y1="24" x2="80" y2="24" stroke="#475569" stroke-width="1" />
    <text x="0" y="38" font-family="'Inter', -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#f8fafc" letter-spacing="1">ID: SL-PROMPT-2026-SR</text>
    <text x="0" y="49" font-family="'Inter', -apple-system, sans-serif" font-size="8" font-weight="500" fill="#a78bfa">Completed: 2026 · Certification</text>
  </g>
</svg>
