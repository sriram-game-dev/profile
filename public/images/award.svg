<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="taw-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070614" />
      <stop offset="50%" stop-color="#140d24" />
      <stop offset="100%" stop-color="#1c0f2a" />
    </linearGradient>
    <radialGradient id="taw-glow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.32" />
      <stop offset="45%" stop-color="#ef4444" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#070614" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="taw-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <linearGradient id="taw-titleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fde047" />
    </linearGradient>
    <filter id="taw-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.85" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="450" fill="url(#taw-bg)" />
  <rect width="800" height="450" fill="url(#taw-glow)" />

  <!-- Stadium Arena Lights &amp; Pitch Lines -->
  <g opacity="0.3">
    <!-- Stadium Floodlight Beams -->
    <polygon points="100,-20 250,300 0,300" fill="#fde047" opacity="0.15" />
    <polygon points="700,-20 800,300 550,300" fill="#fde047" opacity="0.15" />
    <!-- Pitch Floor Perspective -->
    <polygon points="160,220 640,220 740,270 60,270" fill="none" stroke="#f59e0b" stroke-width="1.2" />
    <ellipse cx="400" cy="245" rx="70" ry="18" fill="none" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4,4" />
    <line x1="400" y1="220" x2="400" y2="270" stroke="#f59e0b" stroke-width="1.2" />
  </g>

  <!-- Central Esports Controller &amp; Trophy Graphic -->
  <g transform="translate(400, 155)" filter="url(#taw-shadow)">
    <!-- Pro Controller Body Silhouette -->
    <g transform="translate(0, -10)">
      <path d="M -90,-25 C -110,-25 -130,-10 -130,25 C -130,55 -115,75 -95,75 C -80,75 -70,55 -60,40 C -40,48 40,48 60,40 C 70,55 80,75 95,75 C 115,75 130,55 130,25 C 130,-10 110,-25 90,-25 C 60,-25 45,-15 0,-15 C -45,-15 -60,-25 -90,-25 Z" fill="#0f1124" stroke="url(#taw-gold)" stroke-width="2.5" />

      <!-- D-Pad (Left) -->
      <g transform="translate(-65, 12)">
        <rect x="-6" y="-18" width="12" height="36" rx="2" fill="#1e1b4b" stroke="#f59e0b" stroke-width="1.2" />
        <rect x="-18" y="-6" width="36" height="12" rx="2" fill="#1e1b4b" stroke="#f59e0b" stroke-width="1.2" />
      </g>

      <!-- Action Buttons (Right) -->
      <g transform="translate(65, 12)">
        <circle cx="0" cy="-12" r="5" fill="#f59e0b" />
        <circle cx="12" cy="0" r="5" fill="#ef4444" />
        <circle cx="0" cy="12" r="5" fill="#22c55e" />
        <circle cx="-12" cy="0" r="5" fill="#38bdf8" />
      </g>

      <!-- Analog Thumbsticks -->
      <circle cx="-30" cy="30" r="14" fill="#1f1a3a" stroke="#d97706" stroke-width="1.5" />
      <circle cx="-30" cy="30" r="8" fill="#f59e0b" />
      <circle cx="30" cy="30" r="14" fill="#1f1a3a" stroke="#d97706" stroke-width="1.5" />
      <circle cx="30" cy="30" r="8" fill="#f59e0b" />

      <!-- Center Trophy &amp; Star Emblem -->
      <g transform="translate(0, 10)">
        <polygon points="0,-18 5,-6 18,-6 8,2 12,14 0,7 -12,14 -8,2 -18,-6 -5,-6" fill="#fde047" stroke="#d97706" stroke-width="1.2" />
      </g>
    </g>
  </g>

  <!-- Top Left Badge -->
  <g transform="translate(35, 35)">
    <rect x="0" y="0" width="180" height="26" rx="13" fill="#140e24" fill-opacity="0.85" stroke="#f59e0b" stroke-width="1.2" />
    <circle cx="14" cy="13" r="4" fill="#f59e0b" />
    <text x="26" y="17" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#fde047" letter-spacing="1.5">
      GEN Z LEVEL UP
    </text>
  </g>

  <!-- Top Right Badge -->
  <g transform="translate(615, 35)">
    <rect x="0" y="0" width="150" height="26" rx="13" fill="#140e24" fill-opacity="0.85" stroke="#ef4444" stroke-width="1.2" />
    <text x="75" y="17" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#fca5a5" text-anchor="middle" letter-spacing="2">
      ESPORTS 2026
    </text>
  </g>

  <!-- Vignette Gradient at Bottom for Title Contrast -->
  <rect x="0" y="240" width="800" height="210" fill="url(#taw-bg)" opacity="0.94" />

  <!-- Bottom Title Block -->
  <g transform="translate(400, 310)" text-anchor="middle" filter="url(#taw-shadow)">
    <!-- Small Category Label -->
    <text x="0" y="0" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="800" fill="#f59e0b" letter-spacing="4">
      EA SPORTS FC 26 · GAMING CHAMPIONSHIP
    </text>
    <!-- Big Bold Title -->
    <text x="0" y="38" font-family="'Inter', -apple-system, sans-serif" font-size="34" font-weight="900" fill="url(#taw-titleGrad)" letter-spacing="1">
      ESPORTS TOURNAMENT
    </text>
    <!-- Subtitle -->
    <text x="0" y="66" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="600" fill="#94a3b8" letter-spacing="1">
      GEN Z LEVEL UP · COMPETITIVE EA FC 26 ARENA PARTICIPATION
    </text>
  </g>

  <!-- Bottom Tech Pills / Tags -->
  <g transform="translate(400, 412)" text-anchor="middle">
    <!-- Pill 1 -->
    <rect x="-260" y="-12" width="120" height="24" rx="6" fill="#140e24" stroke="#334155" stroke-width="1" />
    <text x="-200" y="4" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#fde047">EA SPORTS FC</text>

    <!-- Pill 2 -->
    <rect x="-125" y="-12" width="115" height="24" rx="6" fill="#140e24" stroke="#334155" stroke-width="1" />
    <text x="-67" y="4" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#f59e0b">COMPETITIVE</text>

    <!-- Pill 3 -->
    <rect x="10" y="-12" width="115" height="24" rx="6" fill="#140e24" stroke="#334155" stroke-width="1" />
    <text x="67" y="4" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#ef4444">TACTICAL PLAY</text>

    <!-- Pill 4 -->
    <rect x="145" y="-12" width="115" height="24" rx="6" fill="#140e24" stroke="#334155" stroke-width="1" />
    <text x="202" y="4" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#fca5a5">HIGH REFLEXES</text>
  </g>

  <!-- Corner Accents -->
  <path d="M 16 32 L 16 16 L 32 16" fill="none" stroke="#f59e0b" stroke-width="2.5" />
  <path d="M 784 32 L 784 16 L 768 16" fill="none" stroke="#f59e0b" stroke-width="2.5" />
  <path d="M 16 418 L 16 434 L 32 434" fill="none" stroke="#f59e0b" stroke-width="2.5" />
  <path d="M 784 418 L 784 434 L 768 434" fill="none" stroke="#f59e0b" stroke-width="2.5" />
</svg>
