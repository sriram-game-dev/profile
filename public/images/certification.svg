<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="tsl-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040814" />
      <stop offset="50%" stop-color="#081426" />
      <stop offset="100%" stop-color="#081e2b" />
    </linearGradient>
    <radialGradient id="tsl-glow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="45%" stop-color="#f97316" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#040814" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="tsl-orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="tsl-titleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="tsl-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.85" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="450" fill="url(#tsl-bg)" />
  <rect width="800" height="450" fill="url(#tsl-glow)" />

  <!-- Neural Network Mesh Pattern in Background -->
  <g opacity="0.28">
    <circle cx="200" cy="120" r="3" fill="#10b981" />
    <circle cx="320" cy="90" r="4" fill="#34d399" />
    <circle cx="480" cy="90" r="4" fill="#f97316" />
    <circle cx="600" cy="120" r="3" fill="#fb923c" />
    <circle cx="260" cy="180" r="3.5" fill="#38bdf8" />
    <circle cx="540" cy="180" r="3.5" fill="#38bdf8" />
    <line x1="200" y1="120" x2="320" y2="90" stroke="#10b981" stroke-width="1" />
    <line x1="320" y1="90" x2="480" y2="90" stroke="#f97316" stroke-width="1" stroke-dasharray="4,3" />
    <line x1="480" y1="90" x2="600" y2="120" stroke="#fb923c" stroke-width="1" />
    <line x1="200" y1="120" x2="260" y2="180" stroke="#38bdf8" stroke-width="1" />
    <line x1="600" y1="120" x2="540" y2="180" stroke="#38bdf8" stroke-width="1" />
    <line x1="260" y1="180" x2="540" y2="180" stroke="#10b981" stroke-width="0.8" stroke-dasharray="6,4" />
  </g>

  <!-- Central AI Prompt &amp; LLM Inference Card Graphic -->
  <g transform="translate(400, 155)" filter="url(#tsl-shadow)">
    <!-- Terminal Prompt Card -->
    <rect x="-190" y="-70" width="380" height="120" rx="10" fill="#0b1626" fill-opacity="0.9" stroke="#10b981" stroke-width="1.8" />
    <rect x="-185" y="-65" width="370" height="20" fill="#112238" rx="5" />
    <!-- Window Control Dots -->
    <circle cx="-172" cy="-55" r="3.5" fill="#ef4444" />
    <circle cx="-161" cy="-55" r="3.5" fill="#f59e0b" />
    <circle cx="-150" cy="-55" r="3.5" fill="#10b981" />
    <text x="0" y="-51" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#94a3b8" text-anchor="middle">
      AI CONVERSATIONAL INTERACTION · LLM ENGINE
    </text>

    <!-- Chat Prompt 1 (User) -->
    <rect x="-165" y="-32" width="230" height="24" rx="6" fill="#182c47" />
    <text x="-155" y="-16" font-family="'JetBrains Mono', monospace" font-size="9" fill="#38bdf8">
      &gt; "Explain LLM tokenization &amp; weights"
    </text>

    <!-- AI Response 2 -->
    <rect x="-70" y="2" width="235" height="34" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1" />
    <text x="-60" y="16" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#34d399">
      [GPT-4o]: Transformer architecture
    </text>
    <text x="-60" y="28" font-family="'JetBrains Mono', monospace" font-size="8" fill="#a7f3d0">
      Self-attention mechanism computed.
    </text>

    <!-- Glowing Brain / AI Core Badge Floating on Top Right -->
    <g transform="translate(145, -5)">
      <circle cx="0" cy="0" r="16" fill="#0f172a" stroke="#f97316" stroke-width="1.8" />
      <polygon points="0,-7 6,-3 6,5 0,9 -6,5 -6,-3" fill="#f97316" fill-opacity="0.8" />
    </g>
  </g>

  <!-- Top Left Badge -->
  <g transform="translate(35, 35)">
    <rect x="0" y="0" width="180" height="26" rx="13" fill="#0b1626" fill-opacity="0.85" stroke="#f97316" stroke-width="1.2" />
    <circle cx="14" cy="13" r="4" fill="#f97316" />
    <text x="26" y="17" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#fed7aa" letter-spacing="1.5">
      SIMPLILEARN · AI
    </text>
  </g>

  <!-- Top Right Badge -->
  <g transform="translate(615, 35)">
    <rect x="0" y="0" width="150" height="26" rx="13" fill="#0b1626" fill-opacity="0.85" stroke="#10b981" stroke-width="1.2" />
    <text x="75" y="17" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#34d399" text-anchor="middle" letter-spacing="2">
      CERTIFIED 2026
    </text>
  </g>

  <!-- Vignette Gradient at Bottom for Title Contrast -->
  <rect x="0" y="240" width="800" height="210" fill="url(#tsl-bg)" opacity="0.94" />

  <!-- Bottom Title Block -->
  <g transform="translate(400, 310)" text-anchor="middle" filter="url(#tsl-shadow)">
    <!-- Small Category Label -->
    <text x="0" y="0" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="800" fill="#10b981" letter-spacing="4">
      SIMPLILEARN · ARTIFICIAL INTELLIGENCE
    </text>
    <!-- Big Bold Title -->
    <text x="0" y="38" font-family="'Inter', -apple-system, sans-serif" font-size="34" font-weight="900" fill="url(#tsl-titleGrad)" letter-spacing="1">
      CHATGPT 101
    </text>
    <!-- Subtitle -->
    <text x="0" y="66" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="600" fill="#94a3b8" letter-spacing="1">
      WHAT IS CHATGPT? · LARGE LANGUAGE MODELS &amp; GENERATIVE AI
    </text>
  </g>

  <!-- Bottom Tech Pills / Tags -->
  <g transform="translate(400, 412)" text-anchor="middle">
    <!-- Pill 1 -->
    <rect x="-260" y="-12" width="120" height="24" rx="6" fill="#0b1626" stroke="#334155" stroke-width="1" />
    <text x="-200" y="4" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#10b981">LLM FOUNDATIONS</text>

    <!-- Pill 2 -->
    <rect x="-125" y="-12" width="115" height="24" rx="6" fill="#0b1626" stroke="#334155" stroke-width="1" />
    <text x="-67" y="4" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#f97316">GENERATIVE AI</text>

    <!-- Pill 3 -->
    <rect x="10" y="-12" width="115" height="24" rx="6" fill="#0b1626" stroke="#334155" stroke-width="1" />
    <text x="67" y="4" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#38bdf8">WORKFLOWS</text>

    <!-- Pill 4 -->
    <rect x="145" y="-12" width="115" height="24" rx="6" fill="#0b1626" stroke="#334155" stroke-width="1" />
    <text x="202" y="4" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#34d399">AUTOMATION</text>
  </g>

  <!-- Corner Accents -->
  <path d="M 16 32 L 16 16 L 32 16" fill="none" stroke="#f97316" stroke-width="2.5" />
  <path d="M 784 32 L 784 16 L 768 16" fill="none" stroke="#f97316" stroke-width="2.5" />
  <path d="M 16 418 L 16 434 L 32 434" fill="none" stroke="#10b981" stroke-width="2.5" />
  <path d="M 784 418 L 784 434 L 768 434" fill="none" stroke="#10b981" stroke-width="2.5" />
</svg>
