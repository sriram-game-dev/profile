<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#06b6d4" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0b1120" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.4" />
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)" />
  <rect width="800" height="500" fill="url(#glow)" />
  <rect width="800" height="500" fill="url(#grid)" />

  <!-- Geometric Accent Lines -->
  <line x1="0" y1="440" x2="800" y2="440" stroke="#334155" stroke-width="1" stroke-dasharray="4,8" />
  <circle cx="400" cy="220" r="160" fill="none" stroke="#8b5cf6" stroke-opacity="0.15" stroke-width="1.5" stroke-dasharray="6,6" />
  <circle cx="400" cy="220" r="110" fill="none" stroke="#06b6d4" stroke-opacity="0.2" stroke-width="2" />

  <!-- Main Icon & Illustration Container -->
  <g transform="translate(400, 205)" filter="url(#shadow)">
    
  <g transform="translate(-48, -40)">
    <rect x="0" y="0" width="96" height="74" rx="8" fill="#1e293b" stroke="#6366f1" stroke-width="3" />
    <line x1="0" y1="18" x2="96" y2="18" stroke="#334155" stroke-width="2" />
    <circle cx="12" cy="9" r="3" fill="#ef4444" />
    <circle cx="22" cy="9" r="3" fill="#f59e0b" />
    <circle cx="32" cy="9" r="3" fill="#10b981" />
    <!-- 3D wireframe cube inside -->
    <path d="M 48 26 L 68 36 L 48 46 L 28 36 Z" fill="none" stroke="#818cf8" stroke-width="2" />
    <path d="M 28 36 L 28 56 L 48 66 L 48 46" fill="none" stroke="#818cf8" stroke-width="2" />
    <path d="M 68 36 L 68 56 L 48 66" fill="none" stroke="#818cf8" stroke-width="2" />
  </g>

  </g>

  <!-- Tag / Badge -->
  <g transform="translate(400, 320)">
    <rect x="-90" y="-14" width="180" height="28" rx="14" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5" />
    <text x="0" y="5" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="700" fill="#8b5cf6" text-anchor="middle" letter-spacing="2.5">WEBINAR · 2026</text>
  </g>

  <!-- Title -->
  <text x="400" y="375" font-family="'Inter', -apple-system, sans-serif" font-size="24" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="-0.5">GAME DEVELOPMENT WEBINAR</text>

  <!-- Subtitle -->
  <text x="400" y="405" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="500" fill="#94a3b8" text-anchor="middle" letter-spacing="0.5">Monolith Academy · Production Pipelines</text>

  <!-- Decorative Corner Accents -->
  <path d="M 24 40 L 24 24 L 40 24" fill="none" stroke="#8b5cf6" stroke-width="2.5" />
  <path d="M 776 40 L 776 24 L 760 24" fill="none" stroke="#8b5cf6" stroke-width="2.5" />
  <path d="M 24 460 L 24 476 L 40 476" fill="none" stroke="#8b5cf6" stroke-width="2.5" />
  <path d="M 776 460 L 776 476 L 760 476" fill="none" stroke="#8b5cf6" stroke-width="2.5" />
</svg>