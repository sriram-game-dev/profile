<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="45%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#141c38" />
    </linearGradient>
    <radialGradient id="safetyGlow" cx="45%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35" />
      <stop offset="40%" stop-color="#d97706" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#050814" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cyberBlue" cx="75%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#050814" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="35%" stop-color="#64748b" />
      <stop offset="65%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="goldPadlock" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="hazard" x1="0%" y1="0%" x2="100%" y2="0%" gradientTransform="rotate(45)">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="25%" stop-color="#f59e0b" />
      <stop offset="25%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="75%" stop-color="#f59e0b" />
      <stop offset="75%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" stroke-opacity="0.45" />
    </pattern>
    <filter id="dropGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.8" />
      <feDropShadow dx="0" dy="0" stdDeviation="25" flood-color="#f59e0b" flood-opacity="0.4" />
    </filter>
    <filter id="hudGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#38bdf8" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Ambient Backdrop -->
  <rect width="1200" height="800" fill="url(#bg)" />
  <rect width="1200" height="800" fill="url(#safetyGlow)" />
  <rect width="1200" height="800" fill="url(#cyberBlue)" />
  <rect width="1200" height="800" fill="url(#grid)" />

  <!-- Industrial Perspective Factory Pipes / Background Structure -->
  <g opacity="0.35">
    <path d="M 0 680 L 1200 680" stroke="#334155" stroke-width="2" />
    <path d="M 0 720 L 1200 720" stroke="#1e293b" stroke-width="3" />
    <!-- Vertical factory pillars -->
    <rect x="80" y="40" width="40" height="740" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
    <rect x="1080" y="40" width="40" height="740" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
    <!-- Overhead piping -->
    <path d="M 0 160 Q 400 120, 800 160 T 1200 140" fill="none" stroke="url(#metal)" stroke-width="22" opacity="0.4" />
    <path d="M 0 190 Q 500 160, 900 200 T 1200 180" fill="none" stroke="#1e293b" stroke-width="14" />
  </g>

  <!-- Industrial Valve Station (Left) -->
  <g transform="translate(180, 240)">
    <!-- Main Pipe -->
    <rect x="0" y="140" width="300" height="50" rx="8" fill="url(#metal)" stroke="#475569" stroke-width="2" />
    <rect x="60" y="125" width="25" height="80" rx="4" fill="#64748b" />
    <rect x="220" y="125" width="25" height="80" rx="4" fill="#64748b" />
    <!-- Valve Stem -->
    <rect x="135" y="60" width="30" height="90" fill="#475569" />
    <!-- Valve Wheel (Red/Orange Industrial Wheel) -->
    <ellipse cx="150" cy="50" rx="80" ry="24" fill="none" stroke="#ef4444" stroke-width="16" />
    <ellipse cx="150" cy="50" rx="30" ry="9" fill="#991b1b" stroke="#fca5a5" stroke-width="2" />
    <line x1="75" y1="50" x2="225" y2="50" stroke="#ef4444" stroke-width="10" />
    <line x1="150" y1="28" x2="150" y2="72" stroke="#ef4444" stroke-width="10" />
    <!-- Holographic Isolation Status -->
    <g transform="translate(150, 0)" filter="url(#hudGlow)">
      <rect x="-65" y="-35" width="130" height="26" rx="6" fill="#0f172a" fill-opacity="0.85" stroke="#ef4444" stroke-width="1.5" />
      <circle cx="-45" cy="-22" r="4" fill="#ef4444" />
      <text x="5" y="-18" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#fca5a5" text-anchor="middle" letter-spacing="1">ISOLATION: 100%</text>
    </g>
  </g>

  <!-- Hero Illustration: LOTO Safety Padlock & Hasps (Center) -->
  <g transform="translate(600, 360)" filter="url(#dropGlow)">
    <!-- Steel Shackle -->
    <path d="M -90 0 L -90 -120 C -90 -230, 90 -230, 90 -120 L 90 0" fill="none" stroke="url(#metal)" stroke-width="38" stroke-linecap="round" />
    <!-- Shackle Highlight -->
    <path d="M -90 0 L -90 -120 C -90 -220, 90 -220, 90 -120 L 90 0" fill="none" stroke="#ffffff" stroke-width="6" opacity="0.4" stroke-linecap="round" />

    <!-- Padlock Body -->
    <rect x="-140" y="-20" width="280" height="240" rx="32" fill="url(#goldPadlock)" stroke="#fde047" stroke-width="3" />
    <!-- Dark Inner Panel -->
    <rect x="-115" y="10" width="230" height="180" rx="20" fill="#1e293b" stroke="#d97706" stroke-width="2" />

    <!-- Hazard Stripes Top Accent -->
    <rect x="-115" y="10" width="230" height="24" rx="6" fill="#f59e0b" opacity="0.9" />
    <text x="0" y="27" font-family="'Montserrat', sans-serif" font-size="12" font-weight="900" fill="#0f172a" text-anchor="middle" letter-spacing="3">DANGER - LOCKED OUT</text>

    <!-- Keyhole -->
    <circle cx="0" cy="95" r="22" fill="#090d16" stroke="#f59e0b" stroke-width="3" />
    <polygon points="-12,100 12,100 8,145 -8,145" fill="#090d16" stroke="#f59e0b" stroke-width="2" />

    <!-- Safety Tag Ribbon (Hanging from shackle) -->
    <g transform="translate(100, 40) rotate(15)">
      <polygon points="0,0 80,0 80,150 40,135 0,150" fill="#dc2626" stroke="#fee2e2" stroke-width="2" />
      <circle cx="40" cy="18" r="8" fill="#ffffff" />
      <text x="40" y="55" font-family="'Montserrat', sans-serif" font-size="13" font-weight="900" fill="#ffffff" text-anchor="middle">DO NOT</text>
      <text x="40" y="75" font-family="'Montserrat', sans-serif" font-size="13" font-weight="900" fill="#ffffff" text-anchor="middle">OPERATE</text>
      <text x="40" y="110" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#fecaca" text-anchor="middle">LOTO #04</text>
    </g>
  </g>

  <!-- VR Spatial Elements / Laser HUD Controls (Right) -->
  <g transform="translate(850, 180)" filter="url(#hudGlow)">
    <!-- VR Floating Tablet / Telemetry Card -->
    <rect x="0" y="0" width="270" height="170" rx="16" fill="#0b1329" fill-opacity="0.85" stroke="#38bdf8" stroke-width="2" />
    <rect x="15" y="15" width="240" height="24" rx="4" fill="#0369a1" fill-opacity="0.4" />
    <text x="25" y="31" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1">▶ VR PROCEDURAL STEP 4/6</text>
    <text x="25" y="65" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#f8fafc">Apply Padlock to Hasps</text>
    <!-- Progress Indicator Bar -->
    <rect x="25" y="80" width="220" height="8" rx="4" fill="#1e293b" />
    <rect x="25" y="80" width="165" height="8" rx="4" fill="url(#goldPadlock)" />
    <!-- Success Badge -->
    <rect x="25" y="110" width="100" height="28" rx="6" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1.5" />
    <text x="75" y="128" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">✓ ZERO ENERGY</text>
    <!-- Laser Pointer Aim Line -->
    <line x1="25" y1="160" x2="-110" y2="210" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="6,4" opacity="0.8" />
    <circle cx="-110" cy="210" r="5" fill="#38bdf8" />
  </g>

  <!-- VR Headset Silhouette Badge (Top Left Corner) -->
  <g transform="translate(60, 60)" filter="url(#hudGlow)">
    <rect x="0" y="0" width="150" height="42" rx="8" fill="#0f172a" fill-opacity="0.9" stroke="#f59e0b" stroke-width="1.8" />
    <path d="M 22 21 C 22 15, 30 15, 36 15 C 42 15, 50 15, 50 21 L 48 29 C 48 33, 40 33, 36 33 C 32 33, 24 33, 24 29 Z" fill="#38bdf8" opacity="0.85" />
    <text x="60" y="26" font-family="'Montserrat', sans-serif" font-size="11" font-weight="800" fill="#f8fafc" letter-spacing="1.5">QUEST VR</text>
  </g>

  <!-- Bottom Title Overlay Badge -->
  <g transform="translate(600, 710)">
    <rect x="-240" y="-30" width="480" height="52" rx="26" fill="#0f172a" fill-opacity="0.92" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1.5" />
    <text x="0" y="3" font-family="'Montserrat', sans-serif" font-size="18" font-weight="900" fill="#f8fafc" text-anchor="middle" letter-spacing="2">LOTO VR TRAINING SIMULATION</text>
  </g>
</svg>