<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="vrl-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06030f" />
      <stop offset="50%" stop-color="#0f0a1e" />
      <stop offset="100%" stop-color="#18082e" />
    </linearGradient>
    <radialGradient id="vrl-labGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#7c3aed" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#06030f" stop-opacity="0" />
    </radialGradient>
    <filter id="vrl-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.8" />
    </filter>
    <filter id="vrl-teleGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#a855f7" flood-opacity="0.8" />
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#vrl-bg)" />
  <rect width="1200" height="800" fill="url(#vrl-labGlow)" />

  <!-- VR Hand Controller (Left) -->
  <g transform="translate(250, 360)" filter="url(#vrl-shadow)">
    <!-- Controller Body -->
    <rect x="-35" y="-20" width="70" height="110" rx="20" fill="#1e293b" stroke="#8b5cf6" stroke-width="3" />
    <!-- Grip Handle -->
    <rect x="-25" y="80" width="50" height="80" rx="14" fill="#0f172a" stroke="#475569" stroke-width="2" />
    <!-- Trigger Button -->
    <rect x="-30" y="20" width="22" height="14" rx="5" fill="#8b5cf6" />
    <!-- Thumbstick -->
    <circle cx="10" cy="-10" r="14" fill="#334155" stroke="#8b5cf6" stroke-width="2" />
    <circle cx="10" cy="-10" r="8" fill="#8b5cf6" />
    <!-- Ray Cast Beam from controller -->
    <line x1="0" y1="-20" x2="0" y2="-280" stroke="#a855f7" stroke-width="3" stroke-dasharray="8,4" opacity="0.9" />
    <circle cx="0" cy="-280" r="12" fill="#a855f7" opacity="0.6" />
  </g>

  <!-- Levitating / Telekinesis Cube (Center) -->
  <g transform="translate(600, 280)" filter="url(#vrl-teleGlow)">
    <!-- Cube Isometric Faces -->
    <polygon points="0,-70 70,-35 70,35 0,70 -70,35 -70,-35" fill="#1e1b4b" stroke="#a855f7" stroke-width="3" />
    <polygon points="0,-70 70,-35 0,0 -70,-35" fill="#2e1065" stroke="#a855f7" stroke-width="2" />
    <polygon points="0,0 70,-35 70,35 0,70" fill="#3b0764" stroke="#a855f7" stroke-width="2" />
    <polygon points="0,0 -70,-35 -70,35 0,70" fill="#1e1b4b" stroke="#a855f7" stroke-width="2" />
    <!-- XR Label on cube face -->
    <text x="18" y="22" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="900" fill="#c084fc" text-anchor="middle">XR</text>
    <!-- Levitation energy rings -->
    <ellipse cx="0" cy="90" rx="80" ry="25" fill="none" stroke="#a855f7" stroke-width="2" opacity="0.7" />
    <ellipse cx="0" cy="90" rx="110" ry="35" fill="none" stroke="#7c3aed" stroke-width="1.5" opacity="0.4" stroke-dasharray="6,4" />
    <!-- Energy sparks -->
    <circle cx="-60" cy="70" r="5" fill="#e879f9" opacity="0.9" />
    <circle cx="60" cy="70" r="5" fill="#e879f9" opacity="0.9" />
    <circle cx="0" cy="55" r="4" fill="#a855f7" opacity="0.8" />
  </g>

  <!-- VR Headset Worn by Player (Right) -->
  <g transform="translate(900, 360)" filter="url(#vrl-shadow)">
    <!-- Head Silhouette -->
    <ellipse cx="0" cy="-30" rx="70" ry="80" fill="#1e293b" stroke="#475569" stroke-width="2" />
    <!-- VR Headset Body -->
    <rect x="-80" y="-60" width="160" height="75" rx="22" fill="#0f172a" stroke="#8b5cf6" stroke-width="4" />
    <!-- Lens Circles -->
    <circle cx="-32" cy="-24" r="24" fill="#1e1b4b" stroke="#a855f7" stroke-width="3" />
    <circle cx="32" cy="-24" r="24" fill="#1e1b4b" stroke="#a855f7" stroke-width="3" />
    <!-- Inner lens glow -->
    <circle cx="-32" cy="-24" r="14" fill="#4c1d95" opacity="0.9" />
    <circle cx="32" cy="-24" r="14" fill="#4c1d95" opacity="0.9" />
    <!-- Strap -->
    <rect x="-6" y="-65" width="12" height="30" rx="4" fill="#334155" />
    <!-- Controller in hand -->
    <rect x="-20" y="70" width="40" height="60" rx="12" fill="#1e293b" stroke="#8b5cf6" stroke-width="2" />
  </g>

  <!-- Spatial Interaction Rays / Field Lines -->
  <g opacity="0.5">
    <line x1="250" y1="280" x2="530" y2="280" stroke="#a855f7" stroke-width="2" stroke-dasharray="6,4" />
    <line x1="900" y1="280" x2="680" y2="280" stroke="#a855f7" stroke-width="2" stroke-dasharray="6,4" />
  </g>

  <!-- Lab Status HUD -->
  <g>
    <rect x="30" y="30" width="220" height="70" rx="12" fill="#0f172a" fill-opacity="0.9" stroke="#8b5cf6" stroke-width="1.5" />
    <text x="50" y="56" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#c084fc">TELEKINESIS</text>
    <text x="50" y="80" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748b">MODE: ACTIVE</text>
    <circle cx="38" cy="68" r="6" fill="#a855f7" />
  </g>

  <!-- Title Badge -->
  <g transform="translate(600, 710)">
    <rect x="-240" y="-30" width="480" height="52" rx="26" fill="#0f172a" fill-opacity="0.92" stroke="rgba(192, 132, 252, 0.4)" stroke-width="1.5" />
    <text x="0" y="3" font-family="'Montserrat', sans-serif" font-size="18" font-weight="900" fill="#f8fafc" text-anchor="middle" letter-spacing="2">VR INTERACTION LAB</text>
  </g>
</svg>