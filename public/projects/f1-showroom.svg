<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="f1-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0505" />
      <stop offset="50%" stop-color="#180b0b" />
      <stop offset="100%" stop-color="#241010" />
    </linearGradient>
    <radialGradient id="f1-speedGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0a0505" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="f1-ferrariRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="50%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <filter id="f1-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.85" />
      <feDropShadow dx="0" dy="0" stdDeviation="18" flood-color="#ef4444" flood-opacity="0.4" />
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#f1-bg)" />
  <rect width="1200" height="800" fill="url(#f1-speedGlow)" />

  <!-- Speed Lines & Floor Grid Reflections -->
  <g opacity="0.35">
    <line x1="0" y1="580" x2="1200" y2="580" stroke="#ef4444" stroke-width="1.5" />
    <line x1="0" y1="640" x2="1200" y2="640" stroke="#f59e0b" stroke-width="2" />
    <path d="M 200 750 L 600 520 L 1000 750" stroke="#334155" stroke-width="2" fill="none" />
  </g>

  <!-- Aerodynamic F1 Race Car Silhouette (Center) -->
  <g transform="translate(600, 360)" filter="url(#f1-shadow)">
    <!-- Aerodynamic Halo & Cockpit -->
    <ellipse cx="0" cy="10" rx="32" ry="16" fill="#0f172a" stroke="#f8fafc" stroke-width="3" />
    <!-- Driver Helmet Indicator -->
    <circle cx="0" cy="10" r="11" fill="#f59e0b" />

    <!-- Sleek F1 Nosecone Body -->
    <path d="M -18 160 L -40 20 L -65 -40 L -90 -90 L -120 -110 L -120 -140 L 120 -140 L 120 -110 L 90 -90 L 65 -40 L 40 20 L 18 160 Z" fill="url(#f1-ferrariRed)" stroke="#fca5a5" stroke-width="2.5" />

    <!-- Front Wing Assembly -->
    <g transform="translate(0, 160)">
      <rect x="-180" y="0" width="360" height="24" rx="6" fill="#0f172a" stroke="#ef4444" stroke-width="2" />
      <!-- Wing Endplates -->
      <rect x="-190" y="-12" width="12" height="42" rx="3" fill="#dc2626" />
      <rect x="178" y="-12" width="12" height="42" rx="3" fill="#dc2626" />
    </g>

    <!-- Massive Rear Wing (Top) -->
    <g transform="translate(0, -140)">
      <rect x="-160" y="-20" width="320" height="24" rx="5" fill="#0f172a" stroke="#ef4444" stroke-width="2.5" />
      <rect x="-170" y="-30" width="14" height="45" rx="3" fill="#f59e0b" />
      <rect x="156" y="-30" width="14" height="45" rx="3" fill="#f59e0b" />
      <text x="0" y="-3" font-family="'Montserrat', sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">XR MOTORSPORT</text>
    </g>

    <!-- Wide Slick Wheels & Tires -->
    <!-- Front Tires -->
    <rect x="-240" y="90" width="50" height="100" rx="14" fill="#090d16" stroke="#475569" stroke-width="2" />
    <rect x="190" y="90" width="50" height="100" rx="14" fill="#090d16" stroke="#475569" stroke-width="2" />
    <!-- Rear Tires -->
    <rect x="-260" y="-130" width="65" height="110" rx="16" fill="#090d16" stroke="#475569" stroke-width="2" />
    <rect x="195" y="-130" width="65" height="110" rx="16" fill="#090d16" stroke="#475569" stroke-width="2" />

    <!-- Showroom Hologram Telemetry Rings -->
    <ellipse cx="0" cy="40" rx="300" ry="120" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="8,6" opacity="0.5" />
  </g>

  <!-- Title Badge -->
  <g transform="translate(600, 710)">
    <rect x="-220" y="-30" width="440" height="52" rx="26" fill="#0f172a" fill-opacity="0.92" stroke="rgba(239, 68, 68, 0.4)" stroke-width="1.5" />
    <text x="0" y="3" font-family="'Montserrat', sans-serif" font-size="18" font-weight="900" fill="#f8fafc" text-anchor="middle" letter-spacing="2">F1 SHOWROOM PROTOTYPE</text>
  </g>
</svg>