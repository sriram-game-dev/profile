<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="wgl-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a1b" />
      <stop offset="50%" stop-color="#0a192f" />
      <stop offset="100%" stop-color="#142c4c" />
    </linearGradient>
    <radialGradient id="wgl-browserGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#050a1b" stop-opacity="0" />
    </radialGradient>
    <filter id="wgl-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#wgl-bg)" />
  <rect width="1200" height="800" fill="url(#wgl-browserGlow)" />

  <!-- Web Browser Window with Real-time 3D Scene Running -->
  <g transform="translate(600, 360)" filter="url(#wgl-shadow)">
    <!-- Browser Window Shell -->
    <rect x="-260" y="-180" width="520" height="360" rx="18" fill="#0f172a" stroke="#334155" stroke-width="3" />
    <!-- Browser Tab Bar -->
    <rect x="-260" y="-180" width="520" height="38" rx="18" fill="#1e293b" />
    <!-- Window Controls -->
    <circle cx="-230" cy="-161" r="6" fill="#ef4444" />
    <circle cx="-210" cy="-161" r="6" fill="#f59e0b" />
    <circle cx="-190" cy="-161" r="6" fill="#10b981" />
    <!-- Address Bar -->
    <rect x="-150" y="-172" width="280" height="22" rx="6" fill="#0f172a" />
    <text x="-10" y="-157" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748b" text-anchor="middle">https://threejs-webgl.app</text>

    <!-- 3D Canvas / Viewport Inside Browser -->
    <rect x="-235" y="-120" width="470" height="275" rx="8" fill="#0b1120" stroke="#1e293b" stroke-width="1.5" />

    <!-- 3D Orbiting Polyhedral Sphere / Geodesic Wireframe (Center) -->
    <g transform="translate(0, 20)">
      <!-- 3D Isometric Wireframe Cube / Tetrahedron -->
      <polygon points="0,-70 65,-30 65,45 0,85 -65,45 -65,-30" fill="#1e3a8a" fill-opacity="0.4" stroke="#38bdf8" stroke-width="3" />
      <polygon points="0,-70 65,-30 0,10 -65,-30" fill="#0284c7" fill-opacity="0.5" stroke="#38bdf8" stroke-width="2.5" />
      <polygon points="0,10 65,-30 65,45 0,85" fill="#0369a1" fill-opacity="0.6" stroke="#38bdf8" stroke-width="2.5" />
      <polygon points="0,10 -65,-30 -65,45 0,85" fill="#0c4a6e" fill-opacity="0.7" stroke="#38bdf8" stroke-width="2.5" />

      <!-- Real-time Light Shading Normal Vectors -->
      <circle cx="0" cy="10" r="6" fill="#facc15" />
      <line x1="0" y1="10" x2="35" y2="-40" stroke="#facc15" stroke-width="2" stroke-dasharray="3,3" />

      <!-- Orbit Ring -->
      <ellipse cx="0" cy="10" rx="140" ry="50" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="8,6" opacity="0.8" />
      <circle cx="130" cy="25" r="7" fill="#10b981" />
    </g>

    <!-- Real-time 60 FPS Telemetry HUD -->
    <g transform="translate(-215, -100)">
      <rect x="0" y="0" width="85" height="24" rx="4" fill="#0f172a" fill-opacity="0.9" stroke="#10b981" stroke-width="1.5" />
      <text x="42" y="16" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#10b981" text-anchor="middle">60.0 FPS</text>
    </g>
  </g>

  <!-- Title Badge -->
  <g transform="translate(600, 710)">
    <rect x="-240" y="-30" width="480" height="52" rx="26" fill="#0f172a" fill-opacity="0.92" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5" />
    <text x="0" y="3" font-family="'Montserrat', sans-serif" font-size="18" font-weight="900" fill="#f8fafc" text-anchor="middle" letter-spacing="2">WEBGL 3D INTERACTIVE</text>
  </g>
</svg>